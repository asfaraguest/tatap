<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatap — Picture in Picture</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #pip-player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
  }
  /* Floating header bar on hover */
  .pip-topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    background: linear-gradient(to bottom, rgba(7, 8, 10, 0.92) 0%, rgba(7, 8, 10, 0.4) 75%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  body:hover .pip-topbar, body.show-topbar .pip-topbar {
    opacity: 1;
    pointer-events: auto;
  }
  .pip-title-box {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 68%;
  }
  .pip-badge {
    background: rgba(14, 165, 233, 0.22);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.45);
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .pip-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #f1f5f9;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .pip-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pip-btn {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #e0f2fe;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(8px);
    transition: all 0.15s ease;
  }
  .pip-btn:hover {
    background: rgba(14, 165, 233, 0.45);
    border-color: #38bdf8;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(14, 165, 233, 0.35);
  }
  /* Subtitle customization directly on Artplayer */
  .art-subtitle {
    font-size: 20px !important;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 3px #000, 0 0 8px rgba(0,0,0,0.9) !important;
    font-weight: 700 !important;
    bottom: 24px !important;
  }
  /* Loading spinner: disappears as soon as Artplayer is ready */
  #pip-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  #pip-spinner.hidden {
    display: none !important;
  }
  .ring {
    width: 38px;
    height: 38px;
    border: 3px solid rgba(56, 189, 248, 0.18);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="pip-topbar" id="pip-topbar">
  <div class="pip-title-box">
    <span class="pip-badge">PiP • Always On Top</span>
    <span class="pip-title-text" id="pip-title">Tatap Player</span>
  </div>
  <div class="pip-actions">
    <button type="button" class="pip-btn" id="pip-restore-btn" title="Kembalikan ke Jendela Utama">
      <span>⤢ Kembalikan</span>
    </button>
  </div>
</div>

<div id="pip-spinner">
  <div class="ring"></div>
</div>

<div id="pip-player"></div>

<script src="/js/vendor/artplayer.js?v=2.12.7.8"></script>
<script src="/js/vendor/hls.min.js?v=2.12.7.8"></script>
<script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var src = params.get("src") || "";
    var startTime = parseFloat(params.get("t") || "0") || 0;
    var subUrl = params.get("sub") || "";
    var subTitle = params.get("title") || "Tatap Mini Player";
    var slug = params.get("slug") || "";
    var ep = params.get("ep") || "";

    var titleEl = document.getElementById("pip-title");
    if(titleEl && subTitle) titleEl.textContent = subTitle;
    document.title = subTitle + " — Tatap PiP (Always on Top)";

    var restoreBtn = document.getElementById("pip-restore-btn");
    var exitPip = function(){
      if(window.tatap_exit_pip && typeof window.tatap_exit_pip === "function"){
        window.tatap_exit_pip();
      } else {
        window.close();
      }
    };
    if(restoreBtn) restoreBtn.onclick = exitPip;

    var hideSpinner = function(){
      var sp = document.getElementById("pip-spinner");
      if(sp) sp.classList.add("hidden");
    };

    if(!src){
      hideSpinner();
      document.body.innerHTML = '<div style="color:#ef4444;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:13px;">URL video tidak ditemukan</div>';
      return;
    }

    var art = new Artplayer({
      container: "#pip-player",
      url: src,
      autoplay: true,
      autoMini: false,
      playbackRate: true,
      aspectRatio: true,
      setting: true,
      hotkey: true,
      pip: false,
      fullscreen: true,
      miniProgressBar: true,
      playsInline: true,
      autoOrientation: true,
      customType: {
        m3u8: function(video, url, artInstance){
          if(Hls.isSupported()){
            if(artInstance.hls) artInstance.hls.destroy();
            var hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            artInstance.hls = hls;
            artInstance.on("destroy", function(){ hls.destroy(); });
          } else if(video.canPlayType("application/vnd.apple.mpegurl")){
            video.src = url;
          }
        }
      }
    });

    // Subtitle setup
    if(subUrl){
      art.subtitle.init({
        url: subUrl,
        type: "vtt",
        encoding: "utf-8",
        style: {
          color: "#fff",
          "font-size": "20px",
          "font-weight": "700",
          "text-shadow": "0 2px 4px rgba(0,0,0,0.95), 0 0 3px #000, 0 0 8px rgba(0,0,0,0.9)"
        }
      });
      art.subtitle.show = true;
    }

    // Hilangkan animasi loading begitu Artplayer siap
    art.on("ready", function(){
      hideSpinner();
      if(startTime > 0){
        art.currentTime = startTime;
      }
      art.play().catch(function(){});
    });

    art.once("video:canplay", function(){
      hideSpinner();
      if(startTime > 0 && Math.abs(art.currentTime - startTime) > 2){
        art.currentTime = startTime;
      }
    });

    // Sinkronisasi posisi tonton ke backend history
    var lastSync = 0;
    function syncHistory(){
      var now = Date.now();
      if(now - lastSync < 2000) return;
      lastSync = now;
      if(slug && art.currentTime > 0){
        try{
          fetch("/api/history", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              slug: slug,
              episode: ep,
              currentTime: art.currentTime,
              duration: art.duration || 0,
              updatedAt: Date.now()
            })
          }).catch(function(){});
        }catch(_){}
      }
    }

    art.on("video:timeupdate", syncHistory);
    art.on("video:pause", syncHistory);
    window.addEventListener("beforeunload", syncHistory);
    window.addEventListener("pagehide", syncHistory);
  })();
</script>
</body>
</html>
